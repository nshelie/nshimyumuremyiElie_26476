<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SmartAccess Login</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Login</h2>
      <form action="/smart-access/login" method="post">
        <input type="text" name="username" placeholder="Username" required />
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        />
        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
